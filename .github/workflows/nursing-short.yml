name: Build nursing Short
on:
  workflow_dispatch:
    inputs:
      upload_private:
        description: "Upload a PRIVATE test to YouTube (requires OAuth secrets)"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install free media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install animation and neural voice libraries
        run: python3 -m pip install --quiet --break-system-packages pillow edge-tts
      - name: Create video
        run: python3 scripts/build_video.py
      - name: Save video as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nursing-short
          path: output/nursing_short.mp4
          retention-days: 7
      - name: Send generated MP4 to Make (when configured)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upload_private != true) }}
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_API_KEY: ${{ secrets.MAKE_WEBHOOK_API_KEY }}
        run: |
          if [[ -n "$MAKE_WEBHOOK_URL" ]]; then
            python3 scripts/send_to_make.py
          else
            echo '::notice::MAKE_WEBHOOK_URL not set; video artifact saved, Make upload skipped.'
          fi
      - name: Check YouTube credentials (skip safely if missing)
        id: youtube_check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_private == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [[ -n "$YOUTUBE_CLIENT_ID" && -n "$YOUTUBE_CLIENT_SECRET" && -n "$YOUTUBE_REFRESH_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::YouTube upload skipped: configure all three OAuth secrets first. Video artifact is available."
          fi
      - name: Upload YouTube Short (scheduled or manual private test)
        if: ${{ steps.youtube_check.outputs.ready == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_VISIBILITY: ${{ github.event_name == 'schedule' && vars.PUBLIC_UPLOAD_ENABLED == 'true' && 'public' || 'private' }}
        run: |
          python3 -m pip install --quiet --break-system-packages google-api-python-client google-auth google-auth-httplib2
          python3 scripts/upload_private.py
